name: Release

on:
  push:
    tags:
      - 'v*'  # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  verify:
    name: Verify tag matches Cargo.toml versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches [package].version and [package.metadata.bundle].version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          python3 - "$tag" <<'PY'
          import sys, tomllib
          tag = sys.argv[1]
          with open("Cargo.toml", "rb") as f:
              data = tomllib.load(f)
          pkg = data["package"]["version"]
          bundle = data["package"]["metadata"]["bundle"]["version"]
          print(f"tag={tag} package={pkg} bundle={bundle}")
          errors = []
          if tag != pkg:
              errors.append(f"Tag v{tag} does not match [package].version = \"{pkg}\"")
          if tag != bundle:
              errors.append(f"Tag v{tag} does not match [package.metadata.bundle].version = \"{bundle}\"")
          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          PY

  build:
    name: Build Release Binaries
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libasound2-dev

      - name: Build
        run: cargo build --release

      - name: Rename binaries (macOS/Linux)
        if: runner.os != 'Windows'
        run: mv target/release/basie-64 target/release/basie-64-${{ runner.os }}

      - name: Rename binaries (Windows)
        if: runner.os == 'Windows'
        run: mv target/release/basie-64.exe target/release/basie-64-Windows.exe

      - name: Upload Artifacts (macOS/Linux)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: basie-64-${{ runner.os }}
          path: target/release/basie-64-${{ runner.os }}

      - name: Upload Artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: basie-64-Windows
          path: target/release/basie-64-Windows.exe

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts
        
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/basie-64-macOS/basie-64-macOS
            artifacts/basie-64-Linux/basie-64-Linux
            artifacts/basie-64-Windows/basie-64-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
