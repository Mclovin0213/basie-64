[package]
name = "basie-64"
version = "0.2.0"
edition = "2021"
default-run = "basie-64"

[lib]
name = "basie_64"
path = "src/lib.rs"

[[bin]]
name = "basie-64"
path = "src/main.rs"

[[bin]]
name = "basie"
path = "src/cli.rs"

[dependencies]
eframe = "0.31.0"
base64 = "0.22.1"
image = "0.25"
regex = "1"
rfd = "0.14"
infer = "0.15"
egui_extras = { version = "0.31.0", features = ["image"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.8"
directories = "5"
dark-light = "1"
walkdir = "2"
data-encoding = "2"
bs58 = "0.5"
percent-encoding = "2"
similar = "2"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
kamadak-exif = "0.5"

[package.metadata.bundle]
name = "Basie-64"
identifier = "com.basie64.app"
icon = ["icon.icns"]
version = "0.1.0"
copyright = "Copyright © 2026. All rights reserved."
category = "Developer Tool"
short_description = "A smooth Base64 encoder and decoder."

[dev-dependencies]
tempfile = "3"
